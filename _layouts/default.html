<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description"
        content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/markdown.css">
    <link rel="stylesheet" href="https://use.typekit.net/yrt0pwo.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    {% seo %}
</head>

<body>
    <header class="header">
        <div class="header-container">
            <div class="brand">
                <a href="{{ site.baseurl }}/">{{ site.title }}</a>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="content-wrapper">
            <aside class="sidebar">
                {% include sidebar.html %}
            </aside>
            <main class="main-content">
                {% include breadcrumbs.html %}
                <div class="pixel-header"></div>
                {{ content }}
            </main>
        </div>
    </div>

    {% include footer.html %}

    <script>
        // Highlight active page in sidebar
        document.addEventListener('DOMContentLoaded', function () {
            const currentPath = window.location.pathname;
            const sidebarLinks = document.querySelectorAll('.sidebar a');

            sidebarLinks.forEach(link => {
                const linkPath = link.getAttribute('href');
                if (currentPath === linkPath || currentPath.startsWith(linkPath) && linkPath !== '/') {
                    link.classList.add('active');
                }
            });
        });
    </script>
</body>

</html>
