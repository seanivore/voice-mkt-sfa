permalink: pretty
title: Agentic Workflow Case Studies
description: Comprehensive research, strategies, and implementation guides. Wait until you see that marketing plan they wrote.
baseurl: ""
url: "https://presenting.august.style"

# Build settings
markdown: kramdown
plugins:
  - jekyll-relative-links
  - jekyll-feed
  - jekyll-seo-tag

# Collections
collections:
  posts:
    output: true

# Default front matter
defaults:
  -
    scope:
      path: ""
    values:
      layout: "default"
  -
    scope:
      path: "index.html"
    values:
      permalink: /
  -
    scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  -
    scope:
      path: "sales-development-ai-secrets.html"
    values:
      permalink: /sales-development-ai-secrets/
  -
    scope:
      path: "implement-bland-modulation-research.html"
    values:
      permalink: /sales-development-ai-secrets/

# Exclude files from being included in the build
exclude:
  - .gitignore
  - .vscode/
  - .cursor/
  - .DS_Store
  - README.md
  - LICENSE

relative_links:
  enabled: true